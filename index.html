<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>BAIRES MODELFEST 2026 — Mi resultado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg-0:#1C3156; --bg-1:#14233f;
    --panel:#20375f; --panel-line:#2f4a78;
    --ink:#f2f2f0; --muted:#a9b7cf;
    --accent:#DAA070; --accent-deep:#c2814f;
    --oro:#d4af37; --plata:#b0b0b0; --bronce:#c8875a; --master:#a774e0;
    --good:#4caf78; --bad:#e07a6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    background:linear-gradient(180deg,var(--bg-0),var(--bg-1));
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:22px 16px 40px;
  }
  .wrap{ width:100%; max-width:480px; }

  h1{
    font-family:'Playfair Display',serif; font-weight:700;
    font-size:clamp(22px,6vw,28px); text-align:center; margin:6px 0 22px;
  }
  h1 em{ font-style:italic; color:var(--accent); font-weight:600; }

  /* ── Buscador (por si entran sin ?n=, o quieren buscar otro número) ── */
  .search{
    display:flex; gap:8px; margin-bottom:20px;
  }
  .search input{
    flex:1; min-width:0;
    background:var(--panel); border:1px solid var(--panel-line); border-radius:8px;
    color:var(--ink); font-size:16px; padding:12px 14px;
    font-family:'Inter',sans-serif;
  }
  .search button{
    appearance:none; border:none; border-radius:8px;
    background:var(--accent); color:#1C3156; font-weight:700;
    padding:0 18px; cursor:pointer; font-size:14px;
  }
  .search button:active{ background:var(--accent-deep); }

  .state{ text-align:center; color:var(--muted); font-size:14px; padding:30px 10px; }

  .card{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:14px;
    padding:22px 20px; margin-bottom:18px;
  }
  .card .modelo{
    font-family:'Playfair Display',serif; font-weight:700; font-size:21px;
    margin:0 0 2px; text-align:center;
  }
  .card .modelista{ text-align:center; color:var(--muted); font-size:14px; margin:0 0 4px; }
  .card .cat{ text-align:center; color:var(--muted); font-size:12.5px; margin:0 0 16px; }

  .premio-badge{
    display:block; margin:0 auto 18px; width:fit-content;
    padding:9px 22px; border-radius:999px; font-weight:700; font-size:14px;
    letter-spacing:.02em;
  }
  .premio-badge.p1{ background:rgba(212,175,55,.18); color:var(--oro); border:1.5px solid var(--oro); }
  .premio-badge.p2{ background:rgba(176,176,176,.18); color:#d8d8d8; border:1.5px solid var(--plata); }
  .premio-badge.p3{ background:rgba(200,135,90,.18); color:var(--bronce); border:1.5px solid var(--bronce); }
  .premio-badge.p0{ background:rgba(255,255,255,.06); color:var(--muted); border:1.5px solid var(--panel-line); }

  .scores{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    margin-bottom:6px;
  }
  .score{
    background:rgba(255,255,255,.04); border-radius:10px; padding:12px 10px; text-align:center;
  }
  .score .lbl{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .score .val{ font-size:20px; font-weight:700; }
  .score .cual{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  .final{
    text-align:center; margin:14px 0 4px;
    padding-top:14px; border-top:1px solid var(--panel-line);
  }
  .final .lbl{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .final .val{ font-family:'Playfair Display',serif; font-size:30px; font-weight:700; }

  .diploma-btn{
    display:block; width:100%; margin-top:18px;
    appearance:none; border:none; border-radius:10px;
    background:var(--accent); color:#1C3156;
    font-family:'Inter',sans-serif; font-weight:700; font-size:15px;
    padding:14px 0; cursor:pointer;
  }
  .diploma-btn:active{ background:var(--accent-deep); }
  .diploma-btn:disabled{ background:#4a5773; color:#8b97ad; cursor:default; }
  .diploma-hint{ text-align:center; font-size:12px; color:var(--muted); margin-top:8px; }

  .footer-note{ text-align:center; color:var(--muted); font-size:12px; margin-top:26px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mi resultado en <em>BAMF 2026</em></h1>

  <div class="search">
    <input type="text" inputmode="numeric" id="inpN" placeholder="N° de modelo">
    <button id="btnBuscar">Buscar</button>
  </div>

  <div id="contenido">
    <div class="state">Cargando resultados…</div>
  </div>

  <p class="footer-note">Los datos se cargan una sola vez, cuando el juzgamiento queda cerrado.<br>Si tu modelo todavía no aparece, probá más tarde.</p>
</div>

<script>
  // ═══════════════════════════════════════════════════════════════════════
  // Config
  // ═══════════════════════════════════════════════════════════════════════
  var DATA_URL = "./resultados.json";

  var DIPLOMA_ASSETS = {
    p1: "./assets/diploma-oro.jpg",
    p2: "./assets/diploma-plata.jpg",
    p3: "./assets/diploma-bronce.jpg"
  };
  var DIPLOMA_ASSETS_MASTER = {
    p1: "./assets/diploma-master-oro.jpg",
    p2: "./assets/diploma-master-plata.jpg",
    p3: "./assets/diploma-master-bronce.jpg"
  };
  var DIPLOMA_COLORS = {
    p1:{ gradTop:[229,187,83],  gradBottom:[246,235,175], accent:[210,176,78]  },
    p2:{ gradTop:[183,183,183], gradBottom:[122,122,122], accent:[219,219,219] },
    p3:{ gradTop:[199,134,114], gradBottom:[244,185,164], accent:[204,146,121] }
  };
  var DIPLOMA_COLORS_MASTER = { gradTop:[230,210,255], gradBottom:[147,51,234], accent:[196,160,255] };

  var DIPLOMA_PX2MM = 297/2000;
  var DIPLOMA_BOX_NOMBRE    = {cx:1000, cy:195,  w:1500, h:110};
  var DIPLOMA_BOX_MODELO    = {cx:1000, cy:915,  w:1500, h:110};
  var DIPLOMA_BOX_CATEGORIA = {cx:500,  cy:1090, w:800,  h:70};
  var DIPLOMA_BOX_SUBCAT    = {cx:1500, cy:1090, w:800,  h:70};
  var DIPLOMA_BOX_GRADO     = {cx:1000, cy:1202, w:900,  h:45};

  // ═══════════════════════════════════════════════════════════════════════
  // Helpers (mismos criterios que el dashboard)
  // ═══════════════════════════════════════════════════════════════════════
  function normId(v){ return String(v).trim().toLowerCase().replace(/^0+/,"") || "0"; }

  function pCls(p){
    var s=String(p).toLowerCase();
    if(s.indexOf("primer")>=0||s==="1"||s.indexOf("1°")>=0||s.indexOf("1er")>=0) return "p1";
    if(s.indexOf("segundo")>=0||s==="2"||s.indexOf("2°")>=0||s.indexOf("2do")>=0) return "p2";
    if(s.indexOf("tercer")>=0||s==="3"||s.indexOf("3°")>=0||s.indexOf("3er")>=0) return "p3";
    return "p0";
  }
  function pLbl(p){
    var s=String(p).toLowerCase();
    if(s.indexOf("primer")>=0||s==="1"||s.indexOf("1°")>=0||s.indexOf("1er")>=0) return "🥇 1° Premio";
    if(s.indexOf("segundo")>=0||s==="2"||s.indexOf("2°")>=0||s.indexOf("2do")>=0) return "🥈 2° Premio";
    if(s.indexOf("tercer")>=0||s==="3"||s.indexOf("3°")>=0||s.indexOf("3er")>=0) return "🥉 3° Premio";
    return "Sin premio";
  }

  var _dataPromise = null;
  function cargarDatos(){
    if(!_dataPromise){
      _dataPromise = fetch(DATA_URL).then(function(r){
        if(!r.ok) throw new Error("no-data");
        return r.json();
      });
    }
    return _dataPromise;
  }

  // ═══════════════════════════════════════════════════════════════════════
  // Render de estados
  // ═══════════════════════════════════════════════════════════════════════
  var contenidoEl = document.getElementById("contenido");

  function renderEstado(html){ contenidoEl.innerHTML = '<div class="state">'+html+'</div>'; }

  function renderResultado(p){
    var pc = pCls(p.premio);
    var esMaster = /master/i.test(p.grado||"");
    var badgeCls = "premio-badge "+pc;

    var html = '<div class="card">'
      +'<p class="modelo">"'+_esc(p.modelo)+'"</p>'
      +'<p class="modelista">'+_esc(p.nombre)+'</p>'
      +'<p class="cat">'+_esc(p.categoria)+(p.subcategoria?" · "+_esc(p.subcategoria):"")+(p.grado?" · "+_esc(p.grado):"")+'</p>'
      +'<span class="'+badgeCls+'">'+pLbl(p.premio)+'</span>'
      +'<div class="scores">'
        +_scoreBox("Montaje y Complejidad", p.montaje, p.montajeCual)
        +_scoreBox("Pintura e Insignias", p.pintura, p.pinturaCual)
        +_scoreBox("Realismo Global", p.realismo, p.realismoCual)
        +_scoreBox("Fidelidad", p.fidelidad, p.fidelidadCual)
      +'</div>'
      +'<div class="final"><div class="lbl">Calificación Final</div><div class="val">'+_esc(p.calificacionFinal)+'</div></div>';

    if(pc!=="p0"){
      html += '<button class="diploma-btn" id="btnDiploma">🏆 Descargar mi diploma</button>'
            + '<p class="diploma-hint" id="diplomaHint"></p>';
    }
    html += '</div>';

    contenidoEl.innerHTML = html;

    if(pc!=="p0"){
      document.getElementById("btnDiploma").addEventListener("click", function(){
        generarDiploma(p, pc, esMaster, this);
      });
    }
  }

  function _scoreBox(lbl, val, cual){
    return '<div class="score"><div class="lbl">'+lbl+'</div><div class="val">'+_esc(val)+'</div>'
      +(cual?'<div class="cual">'+_esc(cual)+'</div>':'')+'</div>';
  }

  function _esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // ═══════════════════════════════════════════════════════════════════════
  // Búsqueda
  // ═══════════════════════════════════════════════════════════════════════
  function buscar(n){
    if(!n){ renderEstado("Ingresá tu N° de modelo."); return; }
    renderEstado("Buscando…");
    cargarDatos().then(function(data){
      var p = data.participantes[normId(n)];
      if(!p){ renderEstado("No encontramos ningún modelo con el N° <strong>"+_esc(n)+"</strong>.<br>Revisá el número o probá más tarde si el juzgamiento todavía no cerró."); return; }
      renderResultado(p);
    }).catch(function(){
      renderEstado("Todavía no hay resultados publicados. Probá más tarde.");
    });
  }

  document.getElementById("btnBuscar").addEventListener("click", function(){
    buscar(document.getElementById("inpN").value.trim());
  });
  document.getElementById("inpN").addEventListener("keydown", function(e){
    if(e.key==="Enter") buscar(this.value.trim());
  });

  // Si viene con ?n=123, buscamos directo
  var params = new URLSearchParams(location.search);
  var nInicial = params.get("n");
  if(nInicial){
    document.getElementById("inpN").value = nInicial;
    buscar(nInicial);
  } else {
    renderEstado("Ingresá el N° de tu modelo (el mismo de tu acreditación) para ver tu resultado.");
  }

  // ═══════════════════════════════════════════════════════════════════════
  // Diploma (mismo dibujo que el dashboard, imagen de fondo cargada al vuelo)
  // ═══════════════════════════════════════════════════════════════════════
  function diplomaRgbToCss(c){ return "rgb("+c[0]+","+c[1]+","+c[2]+")"; }

  function diplomaRenderGradientText(text, boxWpx, boxHpx, colorTop, colorBottom, fontSizeDeltaPx){
    fontSizeDeltaPx = fontSizeDeltaPx || 0;
    var canvas = document.createElement('canvas');
    canvas.width = boxWpx; canvas.height = boxHpx;
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,boxWpx,boxHpx);
    var fontSize = Math.floor(boxHpx*0.72) + fontSizeDeltaPx;
    var maxWidth = boxWpx*0.94;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    do{
      ctx.font = "600 " + fontSize + "px 'Poppins', sans-serif";
      var w = ctx.measureText(text).width;
      if (w <= maxWidth) break;
      fontSize -= 2;
    } while(fontSize > 10);
    var grad = ctx.createLinearGradient(0, boxHpx*0.12, 0, boxHpx*0.88);
    grad.addColorStop(0, diplomaRgbToCss(colorTop));
    grad.addColorStop(1, diplomaRgbToCss(colorBottom));
    ctx.fillStyle = grad;
    ctx.fillText(text, boxWpx/2, boxHpx/2 + fontSize*0.06);
    return canvas.toDataURL('image/png');
  }

  function diplomaDrawGradientBox(doc, text, box, colorTop, colorBottom, fontSizeDeltaPx){
    var dataUrl = diplomaRenderGradientText(text, box.w, box.h, colorTop, colorBottom, fontSizeDeltaPx);
    var wMM = box.w*DIPLOMA_PX2MM, hMM = box.h*DIPLOMA_PX2MM;
    var xMM = box.cx*DIPLOMA_PX2MM - wMM/2, yMM = box.cy*DIPLOMA_PX2MM - hMM/2;
    doc.addImage(dataUrl, 'PNG', xMM, yMM, wMM, hMM);
  }

  function diplomaDrawSolidCenteredText(doc, text, box, colorRGB){
    var wMM = box.w*DIPLOMA_PX2MM, hMM = box.h*DIPLOMA_PX2MM;
    var cxMM = box.cx*DIPLOMA_PX2MM, cyMM = box.cy*DIPLOMA_PX2MM;
    var fs = Math.floor(hMM*2.3);
    doc.setFont('helvetica','normal');
    doc.setTextColor(colorRGB[0],colorRGB[1],colorRGB[2]);
    doc.setFontSize(fs);
    while(doc.getTextWidth(text) > wMM*0.96 && fs > 6){ fs -= 0.5; doc.setFontSize(fs); }
    doc.text(text, cxMM, cyMM, {align:'center', baseline:'middle'});
  }

  function _loadImageAsDataURL(src){
    return new Promise(function(resolve,reject){
      var img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = function(){
        var canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        canvas.getContext('2d').drawImage(img,0,0);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = src;
    });
  }

  async function generarDiploma(p, pc, esMaster, btn){
    var hint = document.getElementById("diplomaHint");
    btn.disabled = true; btn.textContent = "Generando…";
    if(hint) hint.textContent = "";
    try{
      var assetUrl = esMaster ? DIPLOMA_ASSETS_MASTER[pc] : DIPLOMA_ASSETS[pc];
      var colors = esMaster ? DIPLOMA_COLORS_MASTER : DIPLOMA_COLORS[pc];
      var bgDataUrl = await _loadImageAsDataURL(assetUrl);

      var jsPDF = window.jspdf.jsPDF;
      var doc = new jsPDF({orientation:'landscape', unit:'mm', format:'a4', compress:true});
      doc.addImage(bgDataUrl, 'JPEG', 0, 0, 297, 210);

      diplomaDrawGradientBox(doc, p.nombre, DIPLOMA_BOX_NOMBRE, colors.gradTop, colors.gradBottom);
      diplomaDrawGradientBox(doc, p.modelo, DIPLOMA_BOX_MODELO, colors.gradTop, colors.gradBottom, -4.75);
      diplomaDrawSolidCenteredText(doc, String(p.categoria||''), DIPLOMA_BOX_CATEGORIA, colors.accent);
      diplomaDrawSolidCenteredText(doc, String(p.subcategoria||''), DIPLOMA_BOX_SUBCAT, colors.accent);
      diplomaDrawSolidCenteredText(doc, String(p.grado||''), DIPLOMA_BOX_GRADO, colors.accent);

      doc.save("BAMF2026_Diploma_"+p.orden+"_"+String(p.nombre).replace(/[^a-zA-Z0-9]/g,"_")+".pdf");
      btn.textContent = "✅ Descargado";
    }catch(e){
      if(hint) hint.textContent = "No se pudo generar el diploma. Probá de nuevo.";
      btn.textContent = "🏆 Descargar mi diploma";
    }finally{
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
